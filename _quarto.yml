project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - research.qmd
    - projects.qmd
    - teaching.qmd
    - about.qmd
    - 404.qmd
    - home.qmd
  resources:
    - images/
    - files/
    - .nojekyll

website:
  title: "Igor B. Martins"
  description: "Igor B. Martins is an economic historian at Lund University. Research on slavery, wealth, inequality, and African economic history."
  site-url: https://igbaccin.github.io/personal_website/
  favicon: images/hourglass.png
  search: false
  navbar:
    background: "#121619"
    foreground: "#d7dce0"
    logo: images/hourglass.png
    logo-alt: "Igor B. Martins, home"
    title: "Igor B. Martins"
    collapse-below: md
    pinned: true
    right:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: projects.qmd
        text: Projects
      - href: teaching.qmd
        text: Teaching
      - href: about.qmd
        text: About
      - href: files/igor-b-martins-cv.pdf
        text: CV ↗
        target: _blank
  page-footer:
    border: false
    left: |
      <div class="footer-identity"><div><strong>Igor B. Martins</strong><span>Department of Economic History<br>Lund University</span></div></div>
    right: |
      <div class="footer-links"><a href="mailto:igor.martins@ekh.lu.se">igor.martins@ekh.lu.se</a></div>

format:
  html:
    theme: [default, styles.scss]
    css: site-v2.css
    lang: en
    toc: false
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: false
    link-external-icon: false
    fig-responsive: true
    include-before-body: includes/title-placeholder.html
    include-after-body: includes/interactions.html

execute:
  echo: false
