on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Build and publish website

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  render-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'

      - name: Render site
        run: quarto render

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize canonical home links and sitemap
        run: python3 scripts/og-url.py _site

      - name: Generate publication records and language pages
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 scripts/language_pages.py _site

      - name: Add curated AI content index
        run: cp llms-index.txt _site/llms.txt

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
