<a class="skip-link" href="#quarto-document-content">Skip to main content</a>
<script>
  (function () {
    const link = document.querySelector(".skip-link");
    const header = document.getElementById("quarto-header");
    if (link && header) header.before(link);
    // Quarto rewrites links on the home page to absolute URLs; keep this one a same-page jump.
    window.addEventListener("load", function () {
      if (link) link.setAttribute("href", "#quarto-document-content");
    });
  }());
</script>
