<link rel="preload" href="fonts/eb-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
html.i18n-pending #quarto-header, html.i18n-pending #quarto-content, html.i18n-pending .nav-footer { visibility: hidden; }
.hs-lang { display: flex; align-items: center; margin-left: 10px; }
.hs-lang-group { display: flex; align-items: center; gap: 7px; }
.hs-lang a { text-decoration: none; background: none; border: 0; padding: 4px 1px; font-size: .78rem; letter-spacing: .08em; color: #8f989f; cursor: pointer; }
.hs-lang a:hover { color: #fff; }
.hs-lang a[aria-current="true"] { color: #fff; text-decoration: underline; text-underline-offset: 7px; }
.hs-lang span { color: #4d565d; font-size: .78rem; }
@media (max-width: 767px) { .hs-lang { margin: 8px 0 4px; } }
.hs-greeting { font-family: var(--serif); font-style: italic; font-size: 1.05rem; letter-spacing: 0; text-transform: none; color: #cfd5da; margin: 0 0 16px; }

<!-- Runs before the first paint, so the research list opens in the state the visitor last chose. -->
<script>
(function () {
  var root = document.documentElement;
  root.classList.add("js");
  try { if (localStorage.getItem("research-summaries") === "1") root.classList.add("show-summaries"); } catch (_) {}
})();
</script>
<!-- Refresh v when i18n.js changes so visitors receive the updated script. -->
